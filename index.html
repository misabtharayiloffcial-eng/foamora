<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f5f6fa; color: #1a1a2e; min-height: 100vh; }

#auth-screen {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #1a1a2e 0%, #2d2d50 100%);
}
.auth-card {
  background: #fff; border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 400px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.25);
}
.auth-card .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 2rem; }
.auth-card .logo span { font-size: 1.15rem; font-weight: 700; color: #1a1a2e; }
.auth-tabs { display: flex; border-bottom: 2px solid #e8eaf0; margin-bottom: 1.5rem; }
.auth-tab {
  flex: 1; padding: 0.65rem; text-align: center; font-size: 0.85rem; font-weight: 600;
  color: #a0a8c0; cursor: pointer; border-bottom: 2px solid transparent;
  margin-bottom: -2px; transition: all 0.15s;
}
.auth-tab.active { color: #6c5ce7; border-bottom-color: #6c5ce7; }
.auth-field { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1rem; }
.auth-field label { font-size: 0.8rem; font-weight: 600; color: #444; }
.auth-field input {
  padding: 0.6rem 0.8rem; border: 1.5px solid #dde1ed; border-radius: 8px;
  font-size: 0.9rem; color: #1a1a2e; outline: none; transition: border-color 0.15s;
}
.auth-field input:focus { border-color: #6c5ce7; }
.auth-btn {
  width: 100%; padding: 0.7rem; background: #6c5ce7; color: #fff;
  border: none; border-radius: 8px; font-size: 0.9rem; font-weight: 600;
  cursor: pointer; transition: background 0.15s; margin-top: 0.25rem;
}
.auth-btn:hover { background: #5a4bd1; }
.auth-btn:disabled { background: #b2aef5; cursor: not-allowed; }
.auth-error { font-size: 0.8rem; color: #e74c3c; margin-top: 0.75rem; text-align: center; min-height: 1rem; }
.auth-success { font-size: 0.8rem; color: #00b894; margin-top: 0.75rem; text-align: center; }

#app-screen { display: none; }

header {
  background: #1a1a2e; color: #fff; padding: 1.1rem 2rem;
  display: flex; align-items: center; gap: 0.75rem;
}
header h1 { font-size: 1.1rem; font-weight: 600; }
.user-pill {
  margin-left: auto; display: flex; align-items: center; gap: 0.6rem;
  font-size: 0.78rem; color: #a0a8c0;
}
.logout-btn {
  padding: 0.35rem 0.85rem; background: transparent; border: 1px solid rgba(255,255,255,0.2);
  color: #ccc; border-radius: 6px; font-size: 0.78rem; cursor: pointer; transition: all 0.15s;
}
.logout-btn:hover { border-color: #e74c3c; color: #e74c3c; }

.summary {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem;
  padding: 1.25rem 2rem; background: #fff; border-bottom: 1px solid #e8eaf0;
}
.stat { display: flex; flex-direction: column; gap: 0.2rem; }
.stat label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: #7b82a0; }
.stat .val { font-size: 1.3rem; font-weight: 700; color: #1a1a2e; }
.stat.ok .val { color: #00b894; }
.stat.danger .val { color: #d63031; }
.stat.warn .val { color: #e17055; }

.main { display: grid; grid-template-columns: 340px 1fr; min-height: calc(100vh - 130px); }

.form-panel {
  background: #fff; border-right: 1px solid #e8eaf0; padding: 1.5rem;
  display: flex; flex-direction: column; gap: 0.9rem; overflow-y: auto;
}
.form-panel h2 { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: #7b82a0; }
.field { display: flex; flex-direction: column; gap: 0.35rem; }
.field label { font-size: 0.78rem; font-weight: 600; color: #444; }
.field input, .field select {
  padding: 0.52rem 0.72rem; border: 1.5px solid #dde1ed; border-radius: 8px;
  font-size: 0.88rem; background: #fafbff; color: #1a1a2e; outline: none; transition: border-color 0.15s;
}
.field input:focus, .field select:focus { border-color: #6c5ce7; background: #fff; }
.method-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.45rem; }
.method-btn {
  padding: 0.45rem; border: 1.5px solid #dde1ed; border-radius: 8px;
  font-size: 0.75rem; font-weight: 600; cursor: pointer; background: #fafbff;
  color: #555; text-align: center; transition: all 0.15s; user-select: none;
}
.method-btn:hover { border-color: #6c5ce7; color: #6c5ce7; }
.method-btn.active { border-color: #6c5ce7; background: #6c5ce7; color: #fff; }
.add-btn {
  padding: 0.68rem; background: #1a1a2e; color: #fff; border: none;
  border-radius: 8px; font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: background 0.15s;
}
.add-btn:hover { background: #2d2d50; }
.add-btn:disabled { background: #999; cursor: not-allowed; }
.divider { border: none; border-top: 1px solid #e8eaf0; }
#form-error { font-size: 0.78rem; color: #e74c3c; display: none; }

.filter-bar {
  padding: 0.9rem 1.5rem; border-bottom: 1px solid #e8eaf0;
  background: #fafbff; display: flex; align-items: center; gap: 0.7rem; flex-wrap: wrap;
}
.filter-bar input, .filter-bar select {
  padding: 0.42rem 0.72rem; border: 1.5px solid #dde1ed; border-radius: 8px;
  font-size: 0.8rem; background: #fff; color: #1a1a2e; outline: none;
}
.filter-bar input:focus, .filter-bar select:focus { border-color: #6c5ce7; }
.filter-bar label { font-size: 0.76rem; color: #7b82a0; font-weight: 600; }
.export-btn {
  margin-left: auto; padding: 0.42rem 1rem; background: #fff; border: 1.5px solid #dde1ed;
  border-radius: 8px; font-size: 0.78rem; font-weight: 600; color: #555; cursor: pointer; transition: all 0.15s;
}
.export-btn:hover { border-color: #6c5ce7; color: #6c5ce7; }

.table-panel { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
thead th {
  padding: 0.75rem 1rem; text-align: left; font-size: 0.7rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.06em; color: #7b82a0;
  background: #fafbff; border-bottom: 1.5px solid #e8eaf0; white-space: nowrap;
  cursor: pointer; user-select: none;
}
thead th:hover { color: #6c5ce7; }
.sort-icon { margin-left: 3px; opacity: 0.4; }
thead th.sorted .sort-icon { opacity: 1; color: #6c5ce7; }
tbody tr { border-bottom: 1px solid #f0f2f8; transition: background 0.1s; }
tbody tr:hover { background: #fafbff; }
td { padding: 0.8rem 1rem; vertical-align: middle; }
.expense-name { font-weight: 600; color: #1a1a2e; }
.expense-amount { font-weight: 700; font-size: 0.92rem; font-variant-numeric: tabular-nums; }
.date-cell { font-size: 0.8rem; color: #555; }
.status-badge {
  display: inline-block; padding: 0.22rem 0.6rem; border-radius: 20px;
  font-size: 0.7rem; font-weight: 700; letter-spacing: 0.04em;
}
.badge-paid { background: #e0fff5; color: #00916e; }
.badge-overdue { background: #ffe5e5; color: #c0392b; }
.badge-pending { background: #fff4e0; color: #b8690a; }
.method-tag {
  display: inline-block; padding: 0.18rem 0.5rem; border-radius: 6px;
  font-size: 0.7rem; font-weight: 600; background: #eef0ff; color: #6c5ce7;
}
.del-btn {
  background: none; border: none; cursor: pointer; color: #ccc;
  font-size: 0.9rem; padding: 0.3rem; border-radius: 6px; transition: all 0.15s;
}
.del-btn:hover { color: #e74c3c; background: #ffe5e5; }
.empty-state { text-align: center; padding: 4rem 2rem; color: #a0a8c0; }
.empty-state .icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
.loading-row td { text-align: center; color: #a0a8c0; padding: 2rem; font-size: 0.85rem; }

.toast {
  position: fixed; bottom: 1.5rem; right: 1.5rem; padding: 0.7rem 1.2rem;
  background: #1a1a2e; color: #fff; border-radius: 8px; font-size: 0.83rem;
  font-weight: 500; z-index: 999; opacity: 0; transition: opacity 0.2s;
  pointer-events: none;
}
.toast.show { opacity: 1; }

@media (max-width: 820px) {
  .main { grid-template-columns: 1fr; }
  .summary { grid-template-columns: repeat(2, 1fr); }
  .form-panel { border-right: none; border-bottom: 1px solid #e8eaf0; }
  header { padding: 1rem; }
}
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="8" fill="#1a1a2e"/><path d="M7 10h14M7 14h9" stroke="#6c5ce7" stroke-width="2" stroke-linecap="round"/><circle cx="20" cy="18" r="4" fill="#6c5ce7"/><path d="M20 16.5v1.5l1 1" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/></svg>
      <span>Expense Tracker</span>
    </div>
    <div class="auth-tabs">
      <div class="auth-tab active" data-tab="login">Sign in</div>
      <div class="auth-tab" data-tab="signup">Create account</div>
    </div>
    <div id="auth-login">
      <div class="auth-field"><label>Email</label><input type="email" id="login-email" placeholder="you@example.com"></div>
      <div class="auth-field"><label>Password</label><input type="password" id="login-pass" placeholder="••••••••"></div>
      <button class="auth-btn" id="login-btn">Sign in</button>
    </div>
    <div id="auth-signup" style="display:none">
      <div class="auth-field"><label>Email</label><input type="email" id="signup-email" placeholder="you@example.com"></div>
      <div class="auth-field"><label>Password</label><input type="password" id="signup-pass" placeholder="Min 6 characters"></div>
      <button class="auth-btn" id="signup-btn">Create account</button>
    </div>
    <div id="auth-msg" class="auth-error"></div>
  </div>
</div>

<!-- APP -->
<div id="app-screen">
  <header>
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><rect x="2" y="3" width="18" height="16" rx="3" stroke="#fff" stroke-width="1.6"/><path d="M7 8h8M7 12h5" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><circle cx="16" cy="14" r="3.5" fill="#6c5ce7"/><path d="M16 12.8v1.2l.8.8" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/></svg>
    <h1>Business Expense Tracker</h1>
    <div class="user-pill">
      <span id="user-email-display"></span>
      <button class="logout-btn" id="logout-btn">Sign out</button>
    </div>
  </header>

  <div class="summary">
    <div class="stat"><label>Total expenses</label><div class="val" id="s-total">₹0.00</div></div>
    <div class="stat ok"><label>Paid</label><div class="val" id="s-paid">₹0.00</div></div>
    <div class="stat danger"><label>Overdue</label><div class="val" id="s-overdue">₹0.00</div></div>
    <div class="stat warn"><label>Pending</label><div class="val" id="s-pending">₹0.00</div></div>
  </div>

  <div class="main">
    <div class="form-panel">
      <h2>Add expense</h2>
      <div class="field"><label>Expense name *</label><input type="text" id="f-name" placeholder="e.g. Office rent"></div>
      <div class="field"><label>Amount (₹) *</label><input type="number" id="f-amount" placeholder="0.00" min="0" step="0.01"></div>
      <div class="field"><label>Due date *</label><input type="date" id="f-due"></div>
      <div class="field">
        <label>Date paid <span style="color:#a0a8c0;font-weight:400">(leave blank if unpaid)</span></label>
        <input type="date" id="f-paid">
      </div>
      <div class="field">
        <label>Payment method *</label>
        <div class="method-grid" id="method-grid">
          <div class="method-btn" data-val="Cash">Cash</div>
          <div class="method-btn" data-val="UPI">UPI</div>
          <div class="method-btn" data-val="Card">Card</div>
          <div class="method-btn" data-val="NEFT/RTGS">NEFT/RTGS</div>
          <div class="method-btn" data-val="Cheque">Cheque</div>
          <div class="method-btn" data-val="Other">Other</div>
        </div>
      </div>
      <div class="field" id="other-field" style="display:none">
        <label>Specify method</label>
        <input type="text" id="f-other" placeholder="Enter payment method">
      </div>
      <hr class="divider">
      <div id="form-error"></div>
      <button class="add-btn" id="add-btn">+ Add expense</button>
    </div>

    <div style="display:flex;flex-direction:column;">
      <div class="filter-bar">
        <label>Filter:</label>
        <input type="text" id="search" placeholder="Search by name…" style="width:160px">
        <select id="filter-status">
          <option value="">All statuses</option>
          <option value="Paid">Paid</option>
          <option value="Overdue">Overdue</option>
          <option value="Pending">Pending</option>
        </select>
        <select id="filter-method"><option value="">All methods</option></select>
        <button class="export-btn" id="export-btn">⬇ Export CSV</button>
      </div>
      <div class="table-panel">
        <table>
          <thead>
            <tr>
              <th data-col="name">Name <span class="sort-icon">↕</span></th>
              <th data-col="amount">Amount <span class="sort-icon">↕</span></th>
              <th data-col="due_date">Due date <span class="sort-icon">↕</span></th>
              <th data-col="paid_date">Date paid <span class="sort-icon">↕</span></th>
              <th>Method</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="expense-body"></tbody>
        </table>
        <div class="empty-state" id="empty-state" style="display:none">
          <div class="icon">📋</div>
          <p>No expenses yet. Add your first expense using the form.</p>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://kssrvcbgpmlqdnjbodym.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtzc3J2Y2JncG1scWRuamJvZHltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMjIxNjYsImV4cCI6MjA5NjU5ODE2Nn0.MdT2FRxu-4fdxg1Xlucb_MDUBK9PGOn3GG6u8G4JCbk';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let expenses = [];
let selectedMethod = '';
let sortCol = 'due_date', sortDir = 1;
let currentUser = null;

function showToast(msg, duration = 2600) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

function showAuth() {
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('app-screen').style.display = 'none';
}
function showApp(user) {
  currentUser = user;
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
  document.getElementById('user-email-display').textContent = user.email;
  loadExpenses();
}

function setAuthMsg(msg, isError = true) {
  const el = document.getElementById('auth-msg');
  el.textContent = msg;
  el.className = isError ? 'auth-error' : 'auth-success';
}

// Auth tabs
document.querySelectorAll('.auth-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('auth-login').style.display = tab.dataset.tab === 'login' ? 'block' : 'none';
    document.getElementById('auth-signup').style.display = tab.dataset.tab === 'signup' ? 'block' : 'none';
    document.getElementById('auth-msg').textContent = '';
  });
});

// Sign in
document.getElementById('login-btn').addEventListener('click', async () => {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-pass').value;
  const btn   = document.getElementById('login-btn');
  if (!email || !pass) { setAuthMsg('Please enter email and password.'); return; }
  btn.disabled = true; btn.textContent = 'Signing in…';
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  btn.disabled = false; btn.textContent = 'Sign in';
  if (error) { setAuthMsg(error.message); return; }
  showApp(data.user);
});

// Sign up
document.getElementById('signup-btn').addEventListener('click', async () => {
  const email = document.getElementById('signup-email').value.trim();
  const pass  = document.getElementById('signup-pass').value;
  const btn   = document.getElementById('signup-btn');
  if (!email || !pass) { setAuthMsg('Please enter email and password.'); return; }
  if (pass.length < 6) { setAuthMsg('Password must be at least 6 characters.'); return; }
  btn.disabled = true; btn.textContent = 'Creating…';
  const { data, error } = await sb.auth.signUp({ email, password: pass });
  btn.disabled = false; btn.textContent = 'Create account';
  if (error) { setAuthMsg(error.message); return; }
  if (data.user && data.session) {
    showApp(data.user);
  } else {
    setAuthMsg('Account created! Check your email to confirm, then sign in.', false);
  }
});

// Sign out
document.getElementById('logout-btn').addEventListener('click', async () => {
  await sb.auth.signOut();
  expenses = [];
  showAuth();
});

// Method selector
document.getElementById('method-grid').addEventListener('click', e => {
  const btn = e.target.closest('.method-btn');
  if (!btn) return;
  document.querySelectorAll('.method-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedMethod = btn.dataset.val;
  document.getElementById('other-field').style.display = selectedMethod === 'Other' ? 'flex' : 'none';
});

// Sort headers
document.querySelectorAll('thead th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (sortCol === col) sortDir *= -1; else { sortCol = col; sortDir = 1; }
    render();
  });
});

// Load
async function loadExpenses() {
  const body = document.getElementById('expense-body');
  body.innerHTML = '<tr class="loading-row"><td colspan="7">Loading expenses…</td></tr>';
  document.getElementById('empty-state').style.display = 'none';
  const { data, error } = await sb.from('expenses').select('*').order('created_at', { ascending: false });
  if (error) { showToast('Error loading: ' + error.message, 4000); body.innerHTML = ''; return; }
  expenses = data || [];
  render();
}

// Add
document.getElementById('add-btn').addEventListener('click', async () => {
  const name     = document.getElementById('f-name').value.trim();
  const amount   = parseFloat(document.getElementById('f-amount').value);
  const due_date = document.getElementById('f-due').value;
  const paid_date= document.getElementById('f-paid').value || null;
  const method   = selectedMethod === 'Other'
    ? (document.getElementById('f-other').value.trim() || 'Other')
    : selectedMethod;

  const errEl = document.getElementById('form-error');
  if (!name || isNaN(amount) || amount <= 0 || !due_date || !method) {
    errEl.textContent = 'Please fill in name, amount, due date and payment method.';
    errEl.style.display = 'block'; return;
  }
  errEl.style.display = 'none';

  const btn = document.getElementById('add-btn');
  btn.disabled = true; btn.textContent = 'Saving…';

  const { data, error } = await sb.from('expenses')
    .insert([{ user_id: currentUser.id, name, amount, due_date, paid_date, method }])
    .select().single();

  btn.disabled = false; btn.textContent = '+ Add expense';
  if (error) { showToast('Error: ' + error.message, 4000); return; }
  expenses.unshift(data);
  resetForm();
  render();
  showToast('Expense added ✓');
});

// Delete
async function deleteExpense(id) {
  const { error } = await sb.from('expenses').delete().eq('id', id);
  if (error) { showToast('Error deleting: ' + error.message, 4000); return; }
  expenses = expenses.filter(e => e.id !== id);
  render();
  showToast('Deleted');
}

function resetForm() {
  ['f-name','f-amount','f-due','f-paid','f-other'].forEach(id => document.getElementById(id).value = '');
  document.querySelectorAll('.method-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('other-field').style.display = 'none';
  selectedMethod = '';
}

function expStatus(exp) {
  if (exp.paid_date) return 'Paid';
  const today = new Date(); today.setHours(0,0,0,0);
  return new Date(exp.due_date) < today ? 'Overdue' : 'Pending';
}

function fmt(n) { return '₹' + n.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtDate(d) { if (!d) return '—'; const [y,m,day] = d.split('T')[0].split('-'); return `${day}/${m}/${y}`; }
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function render() {
  const methods = [...new Set(expenses.map(e => e.method))];
  const msel = document.getElementById('filter-method');
  const curM = msel.value;
  msel.innerHTML = '<option value="">All methods</option>' +
    methods.map(m => `<option value="${m}"${m===curM?' selected':''}>${escHtml(m)}</option>`).join('');

  const search  = document.getElementById('search').value.toLowerCase();
  const fStatus = document.getElementById('filter-status').value;
  const fMethod = document.getElementById('filter-method').value;

  let list = expenses.filter(e =>
    (!search  || e.name.toLowerCase().includes(search)) &&
    (!fStatus || expStatus(e) === fStatus) &&
    (!fMethod || e.method === fMethod)
  );

  list.sort((a, b) => {
    let va = sortCol === 'amount' ? a.amount : (a[sortCol] || '');
    let vb = sortCol === 'amount' ? b.amount : (b[sortCol] || '');
    return va < vb ? -sortDir : va > vb ? sortDir : 0;
  });

  document.querySelectorAll('thead th[data-col]').forEach(th => {
    th.classList.toggle('sorted', th.dataset.col === sortCol);
    th.querySelector('.sort-icon').textContent =
      th.dataset.col === sortCol ? (sortDir === 1 ? '↑' : '↓') : '↕';
  });

  const body = document.getElementById('expense-body');
  document.getElementById('empty-state').style.display = list.length === 0 && expenses.length === 0 ? 'block' : 'none';

  body.innerHTML = list.length === 0 && expenses.length > 0
    ? `<tr><td colspan="7" style="text-align:center;padding:2rem;color:#a0a8c0;font-size:0.85rem">No results match your filters.</td></tr>`
    : list.map(e => {
        const s  = expStatus(e);
        const bc = s === 'Paid' ? 'badge-paid' : s === 'Overdue' ? 'badge-overdue' : 'badge-pending';
        return `<tr>
          <td class="expense-name">${escHtml(e.name)}</td>
          <td class="expense-amount">${fmt(e.amount)}</td>
          <td class="date-cell">${fmtDate(e.due_date)}</td>
          <td class="date-cell">${fmtDate(e.paid_date)}</td>
          <td><span class="method-tag">${escHtml(e.method)}</span></td>
          <td><span class="status-badge ${bc}">${s}</span></td>
          <td><button class="del-btn" data-id="${e.id}" title="Delete">✕</button></td>
        </tr>`;
      }).join('');

  body.querySelectorAll('.del-btn').forEach(btn =>
    btn.addEventListener('click', () => deleteExpense(btn.dataset.id))
  );

  // Summary totals (all records, not filtered)
  let total=0, paid=0, overdue=0, pending=0;
  expenses.forEach(e => {
    total += e.amount;
    const s = expStatus(e);
    if (s === 'Paid') paid += e.amount;
    else if (s === 'Overdue') overdue += e.amount;
    else pending += e.amount;
  });
  document.getElementById('s-total').textContent    = fmt(total);
  document.getElementById('s-paid').textContent     = fmt(paid);
  document.getElementById('s-overdue').textContent  = fmt(overdue);
  document.getElementById('s-pending').textContent  = fmt(pending);
}

['search','filter-status','filter-method'].forEach(id =>
  document.getElementById(id).addEventListener('input', render)
);

document.getElementById('export-btn').addEventListener('click', () => {
  const rows = [['Name','Amount','Due Date','Date Paid','Method','Status']];
  expenses.forEach(e => rows.push([`"${e.name}"`, e.amount, e.due_date, e.paid_date||'', e.method, expStatus(e)]));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([rows.map(r=>r.join(',')).join('\n')], {type:'text/csv'}));
  a.download = 'expenses.csv'; a.click();
});

// Init — restore session if exists
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) showApp(session.user);
  else showAuth();
})();
</script>
</body>
</html>
